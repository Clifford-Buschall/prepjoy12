<body>
  <!-- Navbar -->
  <nav>
    <h2>PREPJOY</h2>
    <div class="menu-toggle" id="menuToggle">&#9776;</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="categories.html" class="highlight">Categories</a>
      <a href="contact.html">Contact</a>
    </div>

  <!-- Categories Section -->
  <main class="container categories-container">
    <h1 class="title">Explore Ghanaian Dishes</h1>
    <p class="subtitle">Discover popular traditional meals</p>

    <div class="categories-grid">
      <div class="category-card">
        <img src="./images/jollof.jpg"

      </div>

        <img src="./images/images.jpg"

      </div>

        <img src="./images/Waakye-735x490.jpg"

      <div class="category-card">
        <img src="./images/bannku and t.jpg"
             alt="Banku & Tilapia" class="category-image">

      </div>

      <div class="category-card">
        <img src="./images/kenkey and fissh.jpg"
             alt="Kenkey & Fish" class="category-image">
        <h3>Kenkey & Fish</h3>
      </div>

        <img src="./images/red red.jpg"
             alt="Red‑Red (Beans & Plantain)" class="category-image">
