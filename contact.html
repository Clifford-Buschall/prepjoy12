    <div class="contact-container">
        <h1>Get in Touch with PrepJoy</h1>
        <p>We'd love to hear from you! Whether you have a question, a suggestion, or a delicious Ghanaian recipe to
            share, fill out the form below or connect with us on social media.</p>

        <form class="contact-form" action="/submit_form" method="POST">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required
                    placeholder="e.g., Recipe Suggestion or Site Issue">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required placeholder="Tell us what's on your mind..."></textarea>
            </div>

            <button type="submit" class="submit-button">Send Message</button>
        </form>

        <div class="social-links">
            <p style="margin-bottom: 15px; color: #fff;">Connect with us:</p>
            <a href="https://wa.me/qr/XJKPX33LBZ6BB1" aria-label="PrepJoy on whatsApp"><i class="fab fa-whatsApp"></i>WhatsApp</a>

            <a href="#" aria-label="PrepJoy on Twitter"><i class="fab fa-twitter"></i>Twitter</a> -->

    </div>
